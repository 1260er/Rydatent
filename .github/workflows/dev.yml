name: Rydatent Dev Build

on:
  push:
    branches:
      - dev/feasibility
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0"

      - name: Restore development signing key
        env:
          KEYSTORE_B64: ${{ secrets.RYDATENT_DEV_KEYSTORE_B64 }}
        run: |
          printf %s "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rydatent-dev.p12"
          chmod 600 "$RUNNER_TEMP/rydatent-dev.p12"

      - name: Test, lint and build
        env:
          RYDATENT_DEV_KEYSTORE: ${{ runner.temp }}/rydatent-dev.p12
          RYDATENT_DEV_PASSWORD: ${{ secrets.RYDATENT_DEV_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Verify signed APK and publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -Fq "Signer #1 certificate SHA-256 digest: 55edd0be8813fcbbb4276115aa70601f7b43dae9e595f1c84d2c8ac837d7761a" "$RUNNER_TEMP/signature.txt"
          VERSION="$(grep -oE "[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+" app/build.gradle)"
          test "$(printf "%s
" "$VERSION" | wc -l)" -eq 1
          TAG="v$VERSION"
          TAG_SHA="$(git ls-remote origin "refs/tags/$TAG" | cut -f1)"
          if [ -z "$TAG_SHA" ]; then
            echo "No matching release tag: build and signature verified."
            exit 0
          fi
          test "$TAG_SHA" = "$GITHUB_SHA"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Prerelease already exists: $TAG"
            exit 0
          fi
          gh release create "$TAG" "$APK"             --repo "$GITHUB_REPOSITORY" --verify-tag             --title "Rydatent $VERSION"             --notes "Signierter und geprüfter Entwicklungsstand, kein Stable-Release."             --prerelease --latest=false
