name: Rydatent Dev Build

on:
  push:
    branches:
      - dev/feasibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0"

      - name: Restore development signing key
        env:
          KEYSTORE_B64: ${{ secrets.RYDATENT_DEV_KEYSTORE_B64 }}
        run: |
          printf %s "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rydatent-dev.p12"
          chmod 600 "$RUNNER_TEMP/rydatent-dev.p12"

      - name: Test, lint and build
        env:
          RYDATENT_DEV_KEYSTORE: ${{ runner.temp }}/rydatent-dev.p12
          RYDATENT_DEV_PASSWORD: ${{ secrets.RYDATENT_DEV_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: Rydatent-dev-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
